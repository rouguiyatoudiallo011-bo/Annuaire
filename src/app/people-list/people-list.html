@for(person of people(); track $index) {
  <div class="cardPerson">

    <a [routerLink]="['/personnes', person.id.value]">
      <img [src]="person.picture.large" class="imagePerson">

      <div class="infoPerson">
        <h3>
          {{person.name.title}}
          {{person.name.first}}
          {{person.name.last}}
        </h3>
        <p>{{person.location.city}}</p>
      </div>
    </a>

    <button
      class="star"
    (click)="toggleFavorite(person)">
      {{ isFavorite(person.id.value) ? '★' : '☆' }}
    </button>

  </div>
}
